# 🧪 PRUEBA DE UN SOLO USO (22/11/2026): ¿YouTube deja bajar el audio de una promo desde un runner de GitHub? Para que
# las promociones suenen solas (Dlx: «B, que suenen en sus promos»), el ciclo tendría que bajarlas. Se borra después.
name: prueba-ytdlp
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: yt-dlp
        run: |
          pip install -q yt-dlp
          for v in IwcqSwjSW0g 5pS5zNptljY ldB0NsRR7FI; do
            if yt-dlp -q --no-warnings -f bestaudio -o "a_$v.%(ext)s" "https://www.youtube.com/watch?v=$v"; then
              echo "OK $v $(ls -la a_$v.* | awk '{print $5}') bytes"
            else
              echo "FALLA $v"
            fi
          done
