# 🎬 Los shorts de cada evento grabado, a cualquier hora (Dlx, 26/11/2026: «que GitHub haga todo eso cuando sea, pero que
# lo de la madrugada no lo interrumpa»). Hasta ese día lo hacía el paso 2b8j del ciclo, y el ciclo duerme de 3 a 11 AM
# ET: lo que ULAYA entregaba a esa hora esperaba hasta las 11. Este trabajo no duerme: cada media hora mira Logs y, si
# hay una grabación entregada y ningún `procesar` en marcha, lo lanza (bot/shorts_eventos.py, uno por vez).
#
# ⚠️ datos/shorts_eventos.json lo escribe SÓLO este trabajo: salió del ARCHIVOS de guardar.sh, que es «gana el mío» y lo
# pisaría. Repo público: los minutos de Actions no se cobran.
name: shorts

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

concurrency:
  group: shorts-lanzar
  cancel-in-progress: false

jobs:
  lanzar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write     # commitea datos/shorts_eventos.json
      actions: write      # lanza procesar.yml
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
        with:
          creds_json: ${{ secrets.CREDS_JSON }}
          env_file: ${{ secrets.ENV_FILE }}
      - name: mirar y lanzar
        env:
          GH_PROCESAR: ${{ github.token }}
          PYTHONIOENCODING: utf-8
        run: python bot/shorts_eventos.py --aplicar
      - name: guardar
        run: |
          git config user.name  "liga-global-ciclo"
          git config user.email "ciclo@users.noreply.github.com"
          git add datos/shorts_eventos.json
          git diff --cached --quiet && { echo "nada que guardar"; exit 0; }
          git commit -q -m "shorts: $(python -c "import datetime as d, zoneinfo as z; print(d.datetime.now(z.ZoneInfo('America/New_York')).strftime('%Y-%m-%d %I:%M %p').replace(' 0', ' '))") ET"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin "HEAD:main" && exit 0
            sleep 7
          done
          echo "✗ no se pudo guardar"; exit 1
      # 📱 Y UN SHORT A YOUTUBE POR VUELTA (Dlx, 26/11: «ponles diferentes horas de subida»): de los que ya están en la
      # página, el más nuevo que falte (m/shorts_youtube.py, con la cuota del día contada en R2). Privado mientras Google
      # no audite la app. Nunca hace fallar el trabajo; el registro dice sólo cuentas
      - uses: actions/checkout@v4
        with:
          repository: underraponline-lgtm/motor
          ssh-key: ${{ secrets.MOTOR_KEY }}
          path: m
      - name: un short a YouTube
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: |
          [ -n "$YOUTUBE_TOKEN" ] || { echo "youtube: sin permiso"; exit 0; }
          printf '%s' "$YOUTUBE_TOKEN" > "$RUNNER_TEMP/yt.json"
          pip install -q google-auth > /dev/null 2>&1
          export YT_TOKEN="$RUNNER_TEMP/yt.json" UL_RAIZ="$GITHUB_WORKSPACE"
          cd m && python shorts_youtube.py --uno 2>/dev/null | grep -E '^youtube:' || echo "youtube: no subió"
      # 📸 Y A INSTAGRAM, CON SU CALENDARIO (Dlx, 26/11: «que se publiquen en diferentes horarios» y «generes ahí un
      # schedule»): reels a la 1 y las 9 PM ET (y a las 4 si hay cola), y a las 6 el carrusel del día —el lunes la semana
      # en la Liga, el resto las noches de ayer— (m/instagram_calendario.py). Público en el acto. Nunca hace fallar el trabajo
      - name: Instagram, si es su turno
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: |
          [ -n "$INSTAGRAM_TOKEN" ] || { echo "instagram: sin permiso"; exit 0; }
          export UL_RAIZ="$GITHUB_WORKSPACE"
          cd m && python instagram_calendario.py --turno 2>/dev/null | grep -E '^instagram:' || echo "instagram: no anduvo"
