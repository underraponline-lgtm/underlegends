# Procesa un evento grabado. El código vive en un repo privado y se baja con una clave de sólo lectura; este trabajo
# sólo pone la máquina. El registro dice pasos y cuentas, nada más.
name: procesar

on:
  workflow_dispatch:
    inputs:
      desde:
        description: desde cuándo (UTC, 2026-11-23T21:00)
        required: true
        type: string

concurrency:
  group: procesar
  cancel-in-progress: false

jobs:
  procesar:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
        with:
          creds_json: ${{ secrets.CREDS_JSON }}
          env_file: ${{ secrets.ENV_FILE }}
      - uses: actions/checkout@v4
        with:
          repository: underraponline-lgtm/motor
          ssh-key: ${{ secrets.MOTOR_KEY }}
          path: m
      # los modelos se guardan aunque la corrida se caiga (actions/cache sólo guarda si todo salió bien)
      - uses: actions/cache/restore@v4
        id: modelos
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: m-modelos-v1
      # 🌐 el Chromium guardado, la misma clave que el ciclo: piezas_auto.py dibuja las piezas del VS con Playwright
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - name: preparar la máquina
        run: |
          sudo apt-get update -qq > /dev/null 2>&1
          sudo apt-get install -y -qq ffmpeg > /dev/null 2>&1
          ffmpeg -version > /dev/null && echo "ffmpeg listo"
          pip install -q -r m/requirements.txt > /dev/null 2>&1 && echo "librerías listas"
          python -c "import sys; sys.path.insert(0, 'bot'); import navegador; navegador.hace_falta()" > /dev/null 2>&1 && echo "navegador listo"
      - name: procesar
        env:
          DESDE: ${{ inputs.desde }}
          # 📺 el permiso para subir el evento completo al canal (privado): se escribe en un archivo de la máquina y nunca se imprime
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          if [ -n "$YOUTUBE_TOKEN" ]; then printf '%s' "$YOUTUBE_TOKEN" > "$RUNNER_TEMP/yt.json"; export YT_TOKEN="$RUNNER_TEMP/yt.json"; fi
          UL_RAIZ="$GITHUB_WORKSPACE" bash m/nube.sh "$DESDE"
      - uses: actions/cache/save@v4
        if: always() && steps.modelos.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: m-modelos-v1
