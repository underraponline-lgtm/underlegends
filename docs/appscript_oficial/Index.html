<!DOCTYPE html>
<html lang="es">
<head>
<!-- 🔴 ESTA PÁGINA SE RETIRÓ EL 24/09/2026. Dlx: «el hub será esta página y
     principalmente nuestro servidor». Era una tercera pantalla con el
     ranking —además del Sheet y de underlegends.pages.dev— que leía las
     columnas por posición fija y ya se había roto así una vez. La versión
     vieja está en el historial de git (docs/appscript_oficial/Index.html). -->
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liga Global — se mudó</title>
<style>
  :root{--ng:#030304;--pan:#0A0A0D;--tl:#29B298;--tx:#EDEDF2;--tx2:#7E8B89;--bd:#1A2523}
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--ng);color:var(--tx);padding:24px 16px;
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:30rem;text-align:center;background:var(--pan);
       border:1px solid var(--bd);border-radius:6px;padding:32px 24px}
  h1{font-size:1.5rem;line-height:1.25;margin-bottom:12px;letter-spacing:.01em}
  p{color:var(--tx2);line-height:1.5;margin-bottom:24px}
  a{display:inline-block;background:var(--tl);color:#021;font-weight:700;
    text-decoration:none;padding:13px 22px;border-radius:4px}
  a:focus-visible{outline:2px solid var(--tx);outline-offset:3px}
  small{display:block;margin-top:18px;color:var(--tx2);font-size:.8rem}
</style>
</head>
<body>
  <main>
    <h1>La Liga Global se mudó</h1>
    <p>El ranking, las tarjetas, los duelos y los eventos ahora están en
       underlegends.pages.dev y en nuestro servidor de Discord.</p>
    <a href="https://underlegends.pages.dev">Ir a underlegends.pages.dev</a>
    <small>Los datos en crudo siguen en el Sheet de la Liga.</small>
  </main>
</body>
</html>
